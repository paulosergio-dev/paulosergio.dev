<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garimpo do PauLão | Peças de Carros VIP</title>

    <style>
        :root {
            --bg-body: #0a0c10;
            --card-bg: #14171f;
            --accent-gold: #f5a623;
            --accent-glow: rgba(245, 166, 35, 0.35);
            --wpp-green: #25D366;
            --wpp-hover: #20ba59;
            --text-main: #f0f3f6;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at top, #162438 0%, var(--bg-body) 75%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75), 0 0 30px rgba(245, 166, 35, 0.08);
            position: relative;
            text-align: center;
            padding-bottom: 24px;
        }

        .banner-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            overflow: hidden;
            background-color: #0d1117;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            filter: brightness(0.92);
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(20, 23, 31, 0) 35%, var(--card-bg) 100%);
        }

        .badge-vip {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            text-transform: uppercase;
        }

        .content {
            padding: 8px 24px 10px;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: -50px auto 14px;
            position: relative;
            border: 3px solid var(--accent-gold);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            background: #000;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 21px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        h1 span {
            color: var(--accent-gold);
        }

        .subhead {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.45;
            margin-bottom: 20px;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
        }

        .timer-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .timer-count {
            background: var(--accent-gold);
            color: #000;
            font-weight: 800;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .progress-track {
            height: 6px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-gold) 0%, #ffcf70 100%);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: width 0.05s linear;
        }

        .btn-wpp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--wpp-green);
            color: #fff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
            transition: all 0.25s ease;
            animation: pulse-wpp 2s infinite;
        }

        @keyframes pulse-wpp {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
            }

            70% {
                box-shadow: 0 0 0 14px rgba(37, 211, 102, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        .btn-wpp:hover {
            background-color: var(--wpp-hover);
            transform: translateY(-2px);
        }

        .btn-wpp svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .partners {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="banner-wrapper">
            <span class="badge-vip">Auto Peças • Garimpo VIP</span>
            <img src="paulao.png" alt="Garimpo do Paulão" class="banner-img">
            <div class="banner-overlay"></div>
        </div>

        <div class="content">
            <div class="avatar-circle">
                <img src="paulao.png" alt="Paulão">
            </div>

            <h1>Garimpo do Paulão <span>• Carros</span></h1>
            <p class="subhead">Peças multimarcas, mecânica, som, ferramentas e estética automotiva no precinho da
                Shopee, Mercado Livre e Amazon.</p>

            <div class="timer-box">
                <div class="timer-label">
                    <span>A transferir para o WhatsApp...</span>
                    <span class="timer-count" id="countdown">3s</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <!-- Link do Grupo de Carros -->
            <a href="https://chat.whatsapp.com/KpzsPz3O4M2FUcAhj1G7EB" class="btn-wpp" id="wppBtn">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.969.587 1.961.956 2.796.957 3.183 0 5.768-2.587 5.768-5.767 0-3.181-2.586-5.768-5.768-5.768zm7.397 5.766c.002 4.078-3.32 7.398-7.397 7.399-.001 0-.001 0 0 0-1.282 0-2.53-.33-3.623-.956l-4.032 1.058 1.077-3.931c-.684-1.135-1.047-2.434-1.048-3.766.002-4.078 3.32-7.399 7.397-7.399 4.078 0 7.398 3.321 7.398 7.399z" />
                </svg>
                Entrar no Grupo de Carros
            </a>

            <div class="partners">
                <span>Mercado Livre</span>
                <span>•</span>
                <span>Shopee</span>
                <span>•</span>
                <span>Amazon</span>
            </div>
        </div>
    </div>

    <script>
        const targetUrl = "https://chat.whatsapp.com/KpzsPz3O4M2FUcAhj1G7EB";
        const duration = 3000;
        const intervalTime = 30;
        let elapsed = 0;

        const progressBar = document.getElementById("progressBar");
        const countdownEl = document.getElementById("countdown");

        const timer = setInterval(() => {
            elapsed += intervalTime;
            const progress = Math.min((elapsed / duration) * 100, 100);
            if (progressBar) progressBar.style.width = progress + "%";

            const remainingSeconds = Math.ceil((duration - elapsed) / 1000);
            if (countdownEl && remainingSeconds >= 0) {
                countdownEl.textContent = remainingSeconds + "s";
            }

            if (elapsed >= duration) {
                clearInterval(timer);
                const isCrawler = /facebookexternalhit|Facebot|MetaInspector/i.test(navigator.userAgent);
                if (!isCrawler) {
                    window.location.href = targetUrl;
                }
            }
        }, intervalTime);
    </script>
</body>

</html>
